name: CI gate
# Always runs on PRs and reports one stable status ("gate") that branch protection can require,
# even though per-app workflows are path-filtered and may be skipped.
# Stack discovery and checks come from scripts/detect-stacks.py and scripts/verify.sh, so this
# works for any repo layout (sfdx-project.json package directories, any app folder names).
on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Agent-layer tests
        run: |
          bash tests/hooks/test-block-prod-deploy.sh
          bash tests/hooks/test-stop-verify-gate.sh
          bash tests/scripts/test-detect-stacks.sh
      - name: Verify changed stacks (Salesforce validate runs in validate-deploy.yml)
        run: bash scripts/verify.sh --changed origin/${{ github.base_ref }} --full --no-salesforce
